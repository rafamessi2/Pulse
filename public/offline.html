<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pulse – Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon {
      width: 80px; height: 80px;
      border-radius: 20px;
      background: linear-gradient(135deg, #FF3D7F, #A855F7);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      box-shadow: 0 0 40px rgba(255,61,127,0.4);
    }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; }
    p { color: #71717a; font-size: 0.95rem; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #FF3D7F, #A855F7);
      color: white; border: none; border-radius: 12px;
      padding: 0.75rem 2rem; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="icon">
    <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
      <path d="M4 22 L12 10 L20 28 L28 16 L36 22 L40 18"
        stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1>Você está offline</h1>
  <p>Verifique sua conexão e tente novamente.<br />Seus dados continuam salvos no dispositivo.</p>
  <button onclick="window.location.reload()">Tentar novamente</button>
</body>
</html>
